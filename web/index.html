<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOJ CaseHub</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="print.css" media="print" />
</head>
<body>
  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand">
        <h1>DOJ CaseHub</h1>
        <p id="actorInfo">-</p>
      </div>
      <input id="globalSearch" type="text" placeholder="Suche: Fallnr, Name, Identifier, Plate, VIN, Serial, Evidence" />
      <div class="filters">
        <select id="filterStatus"><option value="">Status</option></select>
        <select id="filterType"><option value="">Typ</option></select>
        <select id="filterPriority"><option value="">Priorität</option></select>
      </div>
      <nav id="tabs"></nav>
      <div class="sidebar-actions">
        <button id="refreshBtn">Aktualisieren</button>
        <button id="closeBtn">Schließen</button>
      </div>
    </aside>

    <main>
      <header>
        <h2 id="pageTitle">Dashboard</h2>
        <div id="badgeRow"></div>
      </header>
      <section id="content"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
